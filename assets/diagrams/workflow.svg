<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#0f172a"/>

  <text x="400" y="35" text-anchor="middle" fill="#f1f5f9" font-size="18" font-weight="700">取证工作流</text>
  <text x="400" y="55" text-anchor="middle" fill="#94a3b8" font-size="11">符合 ISO/IEC 27037 · 27042 · RFC 3227 · NIST 800-86</text>

  <!-- 第一步:获取 -->
  <g transform="translate(20, 100)">
    <rect width="130" height="80" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
    <text x="65" y="25" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">1. 获取</text>
    <text x="65" y="42" text-anchor="middle" fill="#bfdbfe" font-size="9">原始数据采集</text>
    <text x="65" y="58" text-anchor="middle" fill="#bfdbfe" font-size="9">dd / python 位对位</text>
    <text x="65" y="72" text-anchor="middle" fill="#fbbf24" font-size="8" font-weight="600">硬件写保护</text>
  </g>

  <!-- 第二步:哈希 -->
  <g transform="translate(170, 100)">
    <rect width="130" height="80" rx="8" fill="#065f46" stroke="#10b981"/>
    <text x="65" y="25" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">2. 哈希</text>
    <text x="65" y="42" text-anchor="middle" fill="#a7f3d0" font-size="9">SHA-256 计算</text>
    <text x="65" y="58" text-anchor="middle" fill="#a7f3d0" font-size="9">4MB 分块</text>
    <text x="65" y="72" text-anchor="middle" fill="#a7f3d0" font-size="8">完整性证明</text>
  </g>

  <!-- 第三步:提取 -->
  <g transform="translate(320, 100)">
    <rect width="130" height="80" rx="8" fill="#7c2d12" stroke="#f59e0b"/>
    <text x="65" y="25" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">3. 提取</text>
    <text x="65" y="42" text-anchor="middle" fill="#fde68a" font-size="9">微信数据提取</text>
    <text x="65" y="58" text-anchor="middle" fill="#fde68a" font-size="9">电脑 / 苹果 / 安卓</text>
    <text x="65" y="72" text-anchor="middle" fill="#fde68a" font-size="8">位对位复制</text>
  </g>

  <!-- 第四步:记录 -->
  <g transform="translate(470, 100)">
    <rect width="130" height="80" rx="8" fill="#5b21b6" stroke="#8b5cf6"/>
    <text x="65" y="25" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">4. 记录</text>
    <text x="65" y="42" text-anchor="middle" fill="#ddd6fe" font-size="9">证据保管链</text>
    <text x="65" y="58" text-anchor="middle" fill="#ddd6fe" font-size="9">ISO 27037 字段</text>
    <text x="65" y="72" text-anchor="middle" fill="#ddd6fe" font-size="8">JSON + TXT</text>
  </g>

  <!-- 第五步:签名 -->
  <g transform="translate(620, 100)">
    <rect width="130" height="80" rx="8" fill="#831843" stroke="#ec4899"/>
    <text x="65" y="25" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">5. 签名</text>
    <text x="65" y="42" text-anchor="middle" fill="#fbcfe8" font-size="9">数字签名</text>
    <text x="65" y="58" text-anchor="middle" fill="#fbcfe8" font-size="9">HMAC / RSA-PSS</text>
    <text x="65" y="72" text-anchor="middle" fill="#fbcfe8" font-size="8">防篡改可验证</text>
  </g>

  <!-- 箭头 -->
  <line x1="150" y1="140" x2="170" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="300" y1="140" x2="320" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="450" y1="140" x2="470" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="600" y1="140" x2="620" y2="140" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- 底部说明 -->
  <text x="400" y="240" text-anchor="middle" fill="#94a3b8" font-size="11">
    每一步均记录:时间戳 · 操作员 · SHA-256 哈希 · 证据编号
  </text>
  <text x="400" y="260" text-anchor="middle" fill="#64748b" font-size="10">
    6. 归档:AES-256 加密压缩包 + 可选云端上传(阿里云 OSS / 百度网盘 / S3 / WebDAV / SFTP / 本地)
  </text>
  <text x="400" y="290" text-anchor="middle" fill="#10b981" font-size="11" font-weight="600">
    ✓ 合法授权场景:个人取证 · 企业合规 · 警方司法取证 · 学术研究
  </text>
</svg>
