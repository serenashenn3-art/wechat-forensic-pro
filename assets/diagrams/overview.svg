<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="540" fill="url(#bg)"/>

  <!-- 标题 -->
  <text x="450" y="42" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">
    微信取证提取工具链 · v2.0.5
  </text>
  <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="12">
    跨平台司法取证工具链 · 符合 ISO/IEC 27037 · 适用于个人/企业/司法取证
  </text>

  <!-- 第一层:原始设备 -->
  <g transform="translate(20, 100)">
    <rect width="180" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="90" y="25" text-anchor="middle" fill="#cbd5e1" font-size="13" font-weight="600">原始设备</text>
    <text x="90" y="42" text-anchor="middle" fill="#64748b" font-size="10">Source Devices</text>

    <!-- PC -->
    <g transform="translate(15, 60)">
      <rect width="150" height="60" rx="6" fill="url(#box)" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">电脑端</text>
      <text x="75" y="42" text-anchor="middle" fill="#cbd5e1" font-size="9">Windows / macOS / Linux</text>
      <text x="75" y="54" text-anchor="middle" fill="#cbd5e1" font-size="9">微信文件目录</text>
    </g>

    <!-- iOS -->
    <g transform="translate(15, 140)">
      <rect width="150" height="60" rx="6" fill="url(#box2)" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">苹果备份</text>
      <text x="75" y="42" text-anchor="middle" fill="#cbd5e1" font-size="9">Finder / iTunes 备份</text>
      <text x="75" y="54" text-anchor="middle" fill="#cbd5e1" font-size="9">MobileSync/Backup/&lt;UDID&gt;</text>
    </g>

    <!-- Android -->
    <g transform="translate(15, 220)">
      <rect width="150" height="60" rx="6" fill="url(#box3)" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">安卓设备</text>
      <text x="75" y="42" text-anchor="middle" fill="#cbd5e1" font-size="9">/sdcard/Android/data/</text>
      <text x="75" y="54" text-anchor="middle" fill="#cbd5e1" font-size="9">com.tencent.mm (需 root)</text>
    </g>

    <!-- 数据库 -->
    <g transform="translate(15, 300)">
      <rect width="150" height="60" rx="6" fill="url(#box4)" opacity="0.9"/>
      <text x="75" y="25" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">微信数据库</text>
      <text x="75" y="42" text-anchor="middle" fill="#cbd5e1" font-size="9">SQLCipher AES-256 加密</text>
      <text x="75" y="54" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="700">⚠ 仅提取 不解密</text>
    </g>
  </g>

  <!-- 第二层:写保护桥 -->
  <g transform="translate(230, 200)">
    <rect width="120" height="80" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="28" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">写保护桥</text>
    <text x="60" y="46" text-anchor="middle" fill="#fcd34d" font-size="9">Write Blocker</text>
    <text x="60" y="60" text-anchor="middle" fill="#94a3b8" font-size="9">Tableau T8u</text>
    <text x="60" y="72" text-anchor="middle" fill="#94a3b8" font-size="9">WiebeTech</text>
  </g>

  <!-- 第三层:取证获取 -->
  <g transform="translate(230, 100)">
    <rect width="120" height="80" rx="8" fill="url(#box)"/>
    <text x="60" y="28" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">位对位镜像</text>
    <text x="60" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Bit-for-bit</text>
    <text x="60" y="62" text-anchor="middle" fill="#cbd5e1" font-size="9">dd 命令</text>
    <text x="60" y="74" text-anchor="middle" fill="#cbd5e1" font-size="9">python_raw_copy</text>
  </g>

  <g transform="translate(230, 300)">
    <rect width="120" height="80" rx="8" fill="url(#box2)"/>
    <text x="60" y="28" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">取证提取</text>
    <text x="60" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="600">Forensic Extraction</text>
    <text x="60" y="62" text-anchor="middle" fill="#cbd5e1" font-size="9">目录级文件提取</text>
    <text x="60" y="74" text-anchor="middle" fill="#cbd5e1" font-size="9">SHA-256 4MB 分块</text>
  </g>

  <!-- 箭头 -->
  <line x1="200" y1="160" x2="230" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="240" x2="230" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="320" x2="230" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="400" x2="230" y2="340" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第四层:哈希校验 -->
  <g transform="translate(380, 200)">
    <rect width="140" height="80" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="28" text-anchor="middle" fill="#10b981" font-size="12" font-weight="700">SHA-256 校验</text>
    <text x="70" y="46" text-anchor="middle" fill="#a7f3d0" font-size="11" font-weight="600">哈希存证</text>
    <text x="70" y="62" text-anchor="middle" fill="#94a3b8" font-size="9">每个文件 / 整体目录</text>
    <text x="70" y="74" text-anchor="middle" fill="#94a3b8" font-size="9">原始证据完整性证明</text>
  </g>

  <!-- 箭头 -->
  <line x1="350" y1="240" x2="380" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第五层:取证报告 -->
  <g transform="translate(550, 100)">
    <rect width="150" height="160" rx="8" fill="url(#box4)"/>
    <text x="75" y="28" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">ISO 27037 报告</text>
    <text x="75" y="46" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">取证报告</text>
    <text x="75" y="68" text-anchor="middle" fill="#cbd5e1" font-size="10">• 合规说明</text>
    <text x="75" y="84" text-anchor="middle" fill="#cbd5e1" font-size="10">• 证据保管链</text>
    <text x="75" y="100" text-anchor="middle" fill="#cbd5e1" font-size="10">• 操作日志</text>
    <text x="75" y="116" text-anchor="middle" fill="#cbd5e1" font-size="10">• 写保护记录</text>
    <text x="75" y="132" text-anchor="middle" fill="#cbd5e1" font-size="10">• 数字签名</text>
    <text x="75" y="150" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">JSON + TXT 双格式</text>
  </g>

  <g transform="translate(550, 300)">
    <rect width="150" height="160" rx="8" fill="url(#box3)"/>
    <text x="75" y="28" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">数字签名</text>
    <text x="75" y="46" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">防篡改</text>
    <text x="75" y="68" text-anchor="middle" fill="#cbd5e1" font-size="10">• HMAC-SHA256</text>
    <text x="75" y="84" text-anchor="middle" fill="#cbd5e1" font-size="10">• RSA-PSS-SHA256</text>
    <text x="75" y="100" text-anchor="middle" fill="#cbd5e1" font-size="10">• 防篡改可验证</text>
    <text x="75" y="116" text-anchor="middle" fill="#cbd5e1" font-size="10">• _signature.json</text>
    <text x="75" y="150" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">司法鉴定可采</text>
  </g>

  <!-- 箭头 -->
  <line x1="520" y1="230" x2="550" y2="180" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="250" x2="550" y2="370" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 第六层:加密归档 -->
  <g transform="translate(730, 200)">
    <rect width="150" height="80" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="75" y="28" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="700">AES-256 加密</text>
    <text x="75" y="46" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">加密归档</text>
    <text x="75" y="62" text-anchor="middle" fill="#94a3b8" font-size="9">带密码 ZIP 压缩包</text>
    <text x="75" y="74" text-anchor="middle" fill="#94a3b8" font-size="9">SHA-256 校验和</text>
  </g>

  <line x1="700" y1="180" x2="730" y2="220" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="700" y1="380" x2="730" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部:合规说明 -->
  <g transform="translate(0, 500)">
    <rect width="900" height="40" fill="#1e40af" opacity="0.95"/>
    <text x="450" y="25" text-anchor="middle" fill="#dbeafe" font-size="12" font-weight="600">
      适用场景:个人取证 · 企业合规审计 · 警方取证(配合司法程序)· 学术研究 · 应急响应
    </text>
  </g>
</svg>
