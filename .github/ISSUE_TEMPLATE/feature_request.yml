name: Feature Request
description: 为 WeChat Forensic Extractor Pro 提议新功能
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 提议新功能前, 请先查看现有 issue 避免重复。
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 当前工作流中你遇到了什么问题?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你希望工具怎么帮你?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些其他方法?
  - type: textarea
    id: context
    attributes:
      label: 补充说明
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 仅 PC 端
        - 仅 macOS
        - 仅移动端 (iOS/Android)
        - 跨平台
    validations:
      required: true
